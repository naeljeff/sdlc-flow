name: Validate skill package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  records:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python tests/validate_package.py
      - name: Match release tag to installed version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: python tests/validate_package.py --expected-version "${RELEASE_TAG#v}"
      - run: python -m unittest discover -s tests -p "test_validate_package.py" -v
      - run: python -m unittest discover -s tests/team -p "test_*.py" -v
      - name: Check evaluation mechanics (POSIX runner)
        if: runner.os != 'Windows'
        run: python tests/team/evaluate.py selftest
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash tests/smoke_install.sh
